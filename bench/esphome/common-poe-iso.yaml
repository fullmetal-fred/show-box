# Olimex ESP32-POE-ISO (WROOM-32E variant). Pins from the Olimex ESP32-POE user
# manual rev 2.7. For WROVER variants the RMII clock is on GPIO0 instead; don't use those.
esp32:
  board: esp32-poe-iso
  framework:
    type: esp-idf

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    mode: CLK_OUT
    pin: GPIO17
  phy_addr: 0
  power_pin: GPIO12
  # Static IP makes boot-time measurements meaningful. Comment out for DHCP.
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0

logger:
  level: INFO

web_server:
  port: 80

ota:
  - platform: esphome
    password: !secret ota_password
