; showbox product firmware. One env per SKU.
;
; Determinism rule (ADR-0004): everything is pinned. Upgrades are deliberate,
; tested on the bench, and noted in CHANGELOG.
;
; Platform: pioarduino (community PlatformIO platform for Arduino-ESP32 3.x).
; Tag 55.03.312 = ESP-IDF 5.5 / Arduino-ESP32 3.3.12 by pioarduino's naming
; convention [verify on first build].

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
board = esp32-poe-iso
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Iskus
    ; Radio is never used (Ethernet only). See docs/compliance.md.
    -DSHOWBOX_NO_RADIO=1
; Libraries are added (pinned to exact versions) when phase 2 starts, e.g.:
; lib_deps =
;     bblanchon/ArduinoJson@7.x.y
;     <OSC library>@x.y.z
;     ESP32Async/ESPAsyncWebServer@x.y.z

[env:gp]
build_flags = ${env.build_flags} -DSHOWBOX_SKU_GP

[env:relay8]
; Board may change to ESP32-POE2 pending power decision (docs/architecture.md).
build_flags = ${env.build_flags} -DSHOWBOX_SKU_RELAY8

[env:input]
build_flags = ${env.build_flags} -DSHOWBOX_SKU_INPUT

[env:ringer]
; Board may change to ESP32-POE2 pending power decision (docs/architecture.md).
build_flags = ${env.build_flags} -DSHOWBOX_SKU_RINGER
